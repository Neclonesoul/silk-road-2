name: Format Svelte

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format conversation page
        run: npx prettier --write 'src/routes/messages/[conversationId]/+page.svelte'

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git add 'src/routes/messages/[conversationId]/+page.svelte'
          git commit -m "style: format realtime conversation"
          git push
